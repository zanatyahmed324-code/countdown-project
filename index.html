<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">Timer</h1>
    
    <div class="inp-sec">
        <label class="sub-title">Enter the time in minutes</label>
        <input id="m-inp" class="m-input" type="number" placeholder="ex:5">
        <button id="s-timer" class="start-timer-btn">Start timer</button>
    </div>

    <div class="output-sec">
        <div id="timer-display">00:00</div>
        <button id="reset_Btn" class="Reset_btn">Reset</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
